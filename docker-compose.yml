x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://cqa:cqa@db:5432/cqa
    CELERY_BROKER_URL: redis://redis:6379/0
    CQA_EXECUTOR: celery
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cqa
      POSTGRES_USER: cqa
      POSTGRES_PASSWORD: cqa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqa"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7

  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py seed_checklist && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    # Concurrency = parallel conversations; keep it within the LLM rate limit.
    command: celery -A config worker --loglevel=info --concurrency=${CQA_MAX_CONCURRENCY:-4}

volumes:
  pgdata:
